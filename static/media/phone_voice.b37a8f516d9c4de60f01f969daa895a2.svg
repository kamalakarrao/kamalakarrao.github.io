<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Phone Voice Agent">
  <defs>
    <linearGradient id="pv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1116"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <radialGradient id="pv-glow" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pv-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16222a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#pv-bg)"/>
  <rect width="640" height="360" fill="url(#pv-grid)" opacity="0.6"/>
  <rect width="640" height="360" fill="url(#pv-glow)"/>

  <!-- signal rings -->
  <g fill="none" stroke="#22d3ee" opacity="0.5">
    <circle cx="320" cy="160" r="78" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="320" cy="160" r="104" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- phone handset (Material "call" icon, centered in the disc) -->
  <g transform="translate(320 160)">
    <circle r="58" fill="#0c141a" stroke="#22d3ee" stroke-width="3"/>
    <g transform="translate(-31 -31) scale(2.6)" fill="#22d3ee">
      <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
    </g>
  </g>

  <!-- waveform -->
  <g fill="#22d3ee">
    <rect x="120" y="150" width="6" height="20" rx="3" opacity="0.55"/>
    <rect x="136" y="138" width="6" height="44" rx="3" opacity="0.7"/>
    <rect x="152" y="124" width="6" height="72" rx="3" opacity="0.85"/>
    <rect x="168" y="146" width="6" height="28" rx="3" opacity="0.6"/>
    <rect x="446" y="146" width="6" height="28" rx="3" opacity="0.6"/>
    <rect x="462" y="124" width="6" height="72" rx="3" opacity="0.85"/>
    <rect x="478" y="138" width="6" height="44" rx="3" opacity="0.7"/>
    <rect x="494" y="150" width="6" height="20" rx="3" opacity="0.55"/>
  </g>

  <!-- captions -->
  <text x="34" y="316" font-family="'JetBrains Mono', monospace" font-size="15" fill="#9aa0a8" letter-spacing="1">AI Voice Agent · calls &amp; captures leads</text>
  <g font-family="'JetBrains Mono', monospace" font-size="12" fill="#22d3ee">
    <g transform="translate(516 296)">
      <rect x="0" y="0" width="42" height="28" rx="14" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="21" y="19" text-anchor="middle">TE</text>
    </g>
    <g transform="translate(566 296)">
      <rect x="0" y="0" width="42" height="28" rx="14" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="21" y="19" text-anchor="middle">EN</text>
    </g>
  </g>
</svg>
