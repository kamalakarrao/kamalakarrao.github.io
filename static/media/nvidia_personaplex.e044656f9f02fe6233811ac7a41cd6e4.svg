<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NVIDIA PersonaPlex POC">
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1411"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <radialGradient id="pp-glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#76b900" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2620" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#pp-bg)"/>
  <rect width="640" height="360" fill="url(#pp-grid)" opacity="0.6"/>
  <rect width="640" height="360" fill="url(#pp-glow)"/>

  <!-- GPU chip -->
  <g transform="translate(320 150)">
    <g stroke="#76b900" stroke-width="3" fill="none" opacity="0.9">
      <!-- pins -->
      <g stroke-width="4">
        <path d="M-44 -66 V-86 M-14 -66 V-86 M16 -66 V-86 M46 -66 V-86"/>
        <path d="M-44 66 V86 M-14 66 V86 M16 66 V86 M46 66 V86"/>
        <path d="M-66 -44 H-86 M-66 -14 H-86 M-66 16 H-86 M-66 46 H-86"/>
        <path d="M66 -44 H86 M66 -14 H86 M66 16 H86 M66 46 H86"/>
      </g>
    </g>
    <rect x="-66" y="-66" width="132" height="132" rx="14" fill="#0c120e" stroke="#76b900" stroke-width="3"/>
    <rect x="-40" y="-40" width="80" height="80" rx="8" fill="none" stroke="#76b900" stroke-width="2" opacity="0.55"/>
    <text x="0" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700" fill="#cde39a" letter-spacing="2">GPU</text>
  </g>

  <!-- persona nodes -->
  <g fill="#76b900">
    <circle cx="150" cy="120" r="7" opacity="0.9"/>
    <circle cx="110" cy="220" r="5" opacity="0.6"/>
    <circle cx="510" cy="130" r="6" opacity="0.8"/>
    <circle cx="540" cy="230" r="8" opacity="0.95"/>
  </g>
  <g stroke="#76b900" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M150 120 L254 138"/>
    <path d="M510 130 L386 138"/>
    <path d="M540 230 L386 176"/>
    <path d="M110 220 L254 176"/>
  </g>

  <!-- captions -->
  <text x="34" y="316" font-family="'JetBrains Mono', monospace" font-size="15" fill="#9aa0a8" letter-spacing="1">NVIDIA PersonaPlex</text>
  <g transform="translate(470 296)">
    <rect x="0" y="0" width="136" height="30" rx="15" fill="none" stroke="#76b900" stroke-opacity="0.6"/>
    <text x="68" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#76b900" letter-spacing="1">~170ms</text>
  </g>
</svg>
